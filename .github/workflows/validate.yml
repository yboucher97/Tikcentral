name: Tikcentral CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tikcentral-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Release validation (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADMIN_API_KEY: ci-admin-key
      WG_SERVER_PUBLIC_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      WG_ENDPOINT: tikcentral.example.invalid:51820
      PUBLIC_HOSTNAME: tikcentral.example.invalid
      TIKCENTRAL_PROVISIONING_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      TIKCENTRAL_ROUTER_API_PASSWORD: ci-router-password
      ROUTER_BACKUP_PASSWORD: ci-backup-password

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Check repository whitespace
        run: git diff --check HEAD^

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m compileall -q app scripts

      - name: Check shell syntax
        run: |
          bash -n bootstrap.sh
          bash -n update.sh
          for file in helpers/* scripts/*.sh; do
            [ -f "$file" ] || continue
            bash -n "$file"
          done

      - name: Validate deployment packaging
        run: python scripts/validate_packaging.py

      - name: Validate release architecture
        run: python scripts/validate_release.py

      - name: Request regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Node for browser regressions
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Shared GUI browser regressions
        run: |
          python tests/render_ui_fixtures.py "$RUNNER_TEMP/tikcentral-ui"
          node tests/ui_regressions.cjs "$RUNNER_TEMP/tikcentral-ui"
